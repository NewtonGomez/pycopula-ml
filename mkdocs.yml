site_name: pycopula-ml
site_description: Copula-based dependence modeling and probabilistic machine learning in Python.
site_author: Enrique Gomez
site_url: https://newtongomez.github.io/pycopula-ml/

repo_name: NewtonGomez/pycopula-ml
repo_url: https://github.com/NewtonGomez/pycopula-ml
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md

  - Getting Started:
      - Quick start: getting-started/quickstart.md
      - Development workflow: getting-started/development.md

  - Concepts:
      - Mathematical foundations: concepts/mathematical_foundations.md
      - Copulas: concepts/copulas.md
      - Marginal models: concepts/marginals.md
      - Parameter estimation: concepts/estimation.md
      - Dependence measures: concepts/dependence.md

  - Architecture:
      - Project architecture: architecture/architecture.md

  - Copulas:
      - Parametric copulas:
          - Overview: copulas/parametrics/index.md
          - Frank copula: copulas/parametrics/frank.md
          - Clayton copula: copulas/parametrics/clayton.md
          - Gaussian copula: copulas/parametrics/gaussian.md
          - Joe copula: copulas/parametrics/joe.md
          - Gumbel-Hougaard copula: copulas/parametrics/gumbel.md
          - Ali-Mikhail-Haq copula: copulas/parametrics/ali_mikhail_haq.md

  - Marginals:
      - Empirical marginals: marginals/empirical_marginals.md
      - Parametric marginals: marginals/parametric_marginals.md
      - Marginal model selection: marginals/model_selection.md

  - Estimation:
      - Maximum-likelihood estimation: estimation/maximum_likelihood.md

  - Model Selection:
      - Copula selection and criteria: model-selection/selection.md

  - Dependence:
      - Mutual information: dependence/mutual_information.md
      - Pairwise weight matrices: dependence/weight_matrices.md

  - Graphs:
      - Chain graphs: graphs/chain.md
      - MST graphs: graphs/mst.md

  - Examples:
      - Dependence examples: examples/dependence.md
      - Chain construction: examples/chain.md
      - MST construction: examples/mst.md

  - Testing and Validation:
      - Parameter estimation: testing/estimation_validation.md
      - Dependence: testing/dependence_validation.md
      - Graphs: testing/graph_validation.md

  - API Reference:
      - Copulas: api/copulas.md
      - Marginals: api/marginals.md
      - Estimation: api/estimation.md
      - Dependence: api/dependence.md
      - Graphs: api/graphs.md

  - References:
      - Bibliography: references/references.md
