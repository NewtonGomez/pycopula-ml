[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "pycopula-ml"
version = "0.1.0"
description = "Copula-based dependence modeling and probabilistic machine learning in Python."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"

authors = [
    { name = "Enrique Gomez" }
]

keywords = [
    "copula",
    "copulas",
    "statistics",
    "probability",
    "dependence",
    "machine-learning",
    "classification",
    "scientific-computing",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    "build>=1.2",
]

research = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "mne>=1.5",
]

docs = [
    "mkdocs-material>=9.0.0",
    "pymdown-extensions>=9.0.0",
    "mkdocs>=1.4.0"
]


[project.urls]
Homepage = "https://github.com/NewtonGomez/pycopula-ml"
Documentation = "https://newtongomez.github.io/pycopula-ml/"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["pycopula_ml"]

[tool.coverage.report]
show_missing = true
fail_under = 90


[tool.ruff]
target-version = "py310"

line-length = 88
indent-width = 4

extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "site",
    "*.egg-info",
]


[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
]

ignore = [
    "E501",
]

fixable = ["ALL"]


[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pycopula_ml"]


[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
