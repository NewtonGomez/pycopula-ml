name: Python CI

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.14,<1.0"

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # Explicit requirements prevent an empty/outdated requirements file
          # from silently skipping runtime dependencies on a PR branch.
          python -m pip install -e . "numpy>=2.1,<3.0" "scipy>=1.15,<2.0" "pytest>=9.0,<10.0"
          python -m pip check

      - name: Verify imports
        run: |
          python - <<'PY'
          import numpy
          import scipy
          import pytest
          import pycopula_ml

          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          print("Pytest:", pytest.__version__)
          print("Local package:", pycopula_ml.__file__)
          PY

      - name: Run test suite
        run: python -m pytest -q
